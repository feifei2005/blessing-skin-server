# Rate limiting: use X-Forwarded-For (real client IP) when behind EdgeOne proxy
map $http_x_forwarded_for $real_client_ip {
    ""      $remote_addr;
    default $http_x_forwarded_for;
}

limit_req_zone $real_client_ip zone=login:10m rate=5r/m;
limit_req_zone $real_client_ip zone=register:10m rate=3r/m;
limit_req_zone $real_client_ip zone=forgot:10m rate=3r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/ssl/skinapi/fullchain.pem;
    ssl_certificate_key /etc/ssl/skinapi/privkey.pem;

    client_max_body_size 50m;

    # Auth POST endpoints: rate limited
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /api/auth/register {
        limit_req zone=register burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /api/auth/forgot {
        limit_req zone=forgot burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # All other requests
    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
